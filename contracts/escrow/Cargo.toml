[package]
name = "escrow"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0"

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
# The second contract the upgrade integration test swaps in. Test-only: it is
# never deployed, and adding it here keeps it out of the escrow's own build.
escrow-fixture = { path = "../escrow-fixture" }
