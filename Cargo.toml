[workspace]
resolver = "2"
# `escrow-fixture` is not deployed. It exists so the escrow's upgrade test has a
# second real wasm to swap in, which is the only way to prove `execute_upgrade`
# actually replaces the running code.
members = ["contracts/escrow", "contracts/escrow-fixture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TalentTrust"]
license = "MIT"
rust-version = "1.75"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
